name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cc-review
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cc-review/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
